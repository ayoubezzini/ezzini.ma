name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          vendor/bin/pest

  # Coolify builds the image (which renders the CV PDFs), swaps containers once the health check passes,
  # then Cloudflare's cache is purged and the live site must answer with this very commit.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ezzini.ma
    steps:
      - name: Trigger the Coolify deployment
        id: coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APPLICATION_UUID: ${{ secrets.COOLIFY_APPLICATION_UUID }}
        run: |
          response=$(curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APPLICATION_UUID&force=false")
          echo "$response"
          echo "deployment=$(echo "$response" | jq -r '.deployments[0].deployment_uuid')" >> "$GITHUB_OUTPUT"

      - name: Wait for the deployment to finish
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT: ${{ steps.coolify.outputs.deployment }}
        run: |
          for attempt in $(seq 1 90); do
            status=$(curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deployments/$DEPLOYMENT" | jq -r '.status')
            echo "Attempt $attempt: $status"

            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*) exit 1 ;;
            esac

            sleep 10
          done

          echo "The deployment didn't finish in 15 minutes."
          exit 1

      - name: Purge the Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq '.success'

      - name: Check that ezzini.ma serves this commit
        run: |
          commit=${GITHUB_SHA::7}

          for attempt in $(seq 1 12); do
            if curl -fsS https://ezzini.ma/en | grep -q "$commit"; then
              echo "Live with $commit."
              exit 0
            fi

            sleep 5
          done

          echo "https://ezzini.ma/en doesn't mention $commit."
          exit 1
