; Small pool: pages are cached by Cloudflare, PHP mostly serves cache misses and the contact form.
[ezzini]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-ezzini.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

request_terminate_timeout = 30s
slowlog = /var/log/php8.4-fpm-ezzini.slow.log
request_slowlog_timeout = 5s
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php8.4-fpm-ezzini.error.log
php_admin_flag[log_errors] = on
